name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Termux/Android Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          default-jdk \
          android-sdk \
          android-sdk-build-tools \
          android-sdk-platform-tools \
          zipalign \
          apksigner

    - name: Display help
      run: make help

    - name: Build APK (full build)
      run: make all

    - name: Verify APK
      run: |
        if [ -f build/apk/app.apk ]; then
          ls -lh build/apk/app.apk
          echo "✓ APK built successfully!"
        else
          echo "✗ APK not found!"
          exit 1
        fi

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: apk-build
        path: build/apk/app.apk
        retention-days: 30

    - name: Clean up
      if: always()
      run: make clean
